name: Backend CI (KAN-4)

on:
  pull_request:
    branches: [dev, main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  push:
    branches:
      - dev
      - main
      - 'feature/**'
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-backend:
    name: Validate Schema, OpenAPI & Mocked Regression Suite
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'
          cache: 'npm'
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma schema
        env:
          DATABASE_URL: postgresql://ci_placeholder:ci_placeholder@localhost:5432/medcodeai_ci
          DIRECT_URL: postgresql://ci_placeholder:ci_placeholder@localhost:5432/medcodeai_ci
        run: npm run prisma:validate

      - name: Generate Prisma Client
        env:
          DATABASE_URL: postgresql://ci_placeholder:ci_placeholder@localhost:5432/medcodeai_ci
          DIRECT_URL: postgresql://ci_placeholder:ci_placeholder@localhost:5432/medcodeai_ci
        run: npm run prisma:generate

      - name: Validate OpenAPI specification
        run: npm run docs:validate

      - name: Run mocked Jest regression suite with coverage (includes Swagger tests)
        env:
          NODE_ENV: test
          JWT_SECRET: ci-placeholder-jwt-secret-at-least-32-characters-long
        run: npm run test:coverage

      - name: Upload test coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage-report
          path: backend/coverage/
          retention-days: 14
